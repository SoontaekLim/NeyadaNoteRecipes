name: Validate recipes

on:
  pull_request:
    paths:
      - "schema/**"
      - "recipes/**"
      - "shopping/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install "jsonschema~=4.23"

      - name: Validate recipes
        run: python scripts/validate_recipes.py

      - name: Test distribution builder
        run: python scripts/test_distribution.py

      - name: Build distribution
        run: python scripts/build_dist.py
